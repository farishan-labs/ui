<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme =
            stored === "light" || stored === "dark" ? stored : prefersDark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <title>FHL UI Docs</title>
    <link rel="stylesheet" href="/dist/tokens.css" />
    <link rel="stylesheet" href="/docs-site/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <button
      id="menuToggle"
      class="menu-toggle"
      type="button"
      aria-label="Toggle navigation menu"
      aria-expanded="false"
      aria-controls="sidebar"
    >
      &#9776;
    </button>
    <div id="backdrop" class="backdrop" aria-hidden="true"></div>
    <aside id="sidebar">
      <h1>FHL UI</h1>
      <input id="search" type="search" placeholder="Search..." />
      <ui-button id="themeToggle" variant="secondary" label="Toggle theme"></ui-button>
      <nav>
        <a href="#/README">Overview</a>
        <a href="#/PHILOSOPHY">Philosophy</a>
        <a href="#/LAYOUT">Layout</a>
        <a href="#/BASELINE">Baseline</a>
        <a href="#/demo">Demo</a>
        <a href="#/components">Components</a>
      </nav>
    </aside>
    <main id="content">Loading…</main>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-markup.min.js"></script>
    <script type="module" src="/docs-site/app.js"></script>
  </body>
</html>
